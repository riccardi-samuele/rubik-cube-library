name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Run standard release validation
        run: scripts/release_check.sh --profile standard

  sanitizer:
    name: ASan UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure sanitizer build
        run: cmake --preset asan-ubsan

      - name: Build sanitizer preset
        run: cmake --build --preset asan-ubsan

      - name: Run sanitizer tests
        run: ctest --preset asan-ubsan --output-on-failure
